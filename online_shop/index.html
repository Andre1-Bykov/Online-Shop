<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин гитар</title>
  <link rel="stylesheet" href="./styles/styles.css">
  <script src="./js/main.js" defer></script>
  <link rel="icon" href="./images/icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

  <!-- Шапка -->
  <header>
    <div class="header-left">
      <h1>Guitar Shop</h1>
      <nav>
        <a href="index.html">Главная</a>
        <a href="index.html#catalog-section">Каталог</a>
        <a href="cart.html">Корзина</a>
        <a href="#contacts">Контакты</a>
      </nav>
      <img src="./images/icon.png" alt="logo" id="logo">
    </div>
    <a href="cart.html" class="cart" id="cart">
        🛒 Корзина (<span id="cart-count">0</span>)
    </a>
  </header>

  <!-- Поиск товаров -->
  <section class="search-section">
    <h2>Поиск товаров</h2>
    <div class="search-controls">
      <input id="search-input" type="text" placeholder="Введите название гитары...">
      <select id="filter-type" class="filter-control">
        <option value="all">Все типы</option>
      </select>
      <select id="filter-brand" class="filter-control">
        <option value="all">Все бренды</option>
      </select>
      <select id="sort-order" class="filter-control">
        <option value="name-asc">Сортировка: название A→Z</option>
        <option value="name-desc">Сортировка: название Z→A</option>
        <option value="price-asc">Сортировка: цена ↑</option>
        <option value="price-desc">Сортировка: цена ↓</option>
      </select>
    </div>
  </section>

  <!-- Каталог -->
  <section class="catalog" id="catalog-section">
    <h2>Каталог товаров</h2>
    <div class="catalog-placeholder">
      <div id="catalog">
      </div>
    </div>
  </section>

  <!-- Подвал -->
  <footer>
    <p>© 2026 Guitar Shop</p>
  </footer>

</body>
</html>
