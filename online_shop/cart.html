<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина - Guitar Shop</title>
  <link rel="stylesheet" href="./styles/styles.css">
  <script src="./js/cart.js" defer></script>
  <link rel="icon" href="./images/icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Guitar Shop</h1>
      <nav>
        <a href="index.html">Главная</a>
        <a href="index.html#catalog">Каталог</a>
        <a href="cart.html">Корзина</a>
        <a href="#contacts">Контакты</a>
      </nav>
      <img src="./images/icon.png" alt="logo" id="logo">
    </div>
    <a href="cart.html" class="cart" id="cart">
      🛒 Корзина (<span id="cart-count">0</span>)
    </a>
  </header>

  <section class="cart-page">
    <h2>Ваша корзина</h2>

    <div class="cart-page-content">
      <div class="cart-items" id="cart-items"></div>

      <aside class="cart-summary">
        <div class="summary-block">
          <h3>Итог заказа</h3>
          <p id="total-sum">0 ₽</p>
        </div>
        <button id="checkout-btn" class="checkout-btn" type="button">Оформить заказ</button>
      </aside>
    </div>

    <p class="cart-empty" id="empty-cart-message">Ваша корзина пуста. Добавьте товары на главной странице.</p>
  </section>

  <footer>
    <p>© 2026 Guitar Shop</p>
  </footer>
</body>
</html>
